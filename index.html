<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Devdat Kumar</title>

<style>
body {
    margin:0;
    font-family: monospace;
    background: green;
    color: gold;
    overflow:hidden;
}

canvas {
    position:fixed;
    top:0;
    left:0;
    z-index:0;
}

#loginPage{
    position:fixed;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:black;
    color:#00ff00;
    z-index:2;
}

#loginBox{
    border:1px solid #00ff00;
    padding:30px;
    box-shadow:0 0 20px #00ff00;
    text-align:center;
}

input{
    display:block;
    margin:10px;
    padding:10px;
    font-size:18px;
}

button{
    padding:10px 20px;
    cursor:pointer;
}

#main{
    display:none;
    text-align:center;
    padding-top:50px;
    position:relative;
    z-index:1;
}

h1{
    color:gold;
    font-size:40px;
    text-shadow:0 0 15px gold;
}

#notepad{
    margin-top:20px;
    width:80%;
    margin-left:auto;
    margin-right:auto;
    background:black;
    border:2px solid gold;
    padding:15px;
}

textarea{
    width:100%;
    height:150px;
    background:#111;
    color:gold;
    border:1px solid gold;
    padding:10px;
}

.note{
    border:1px solid gold;
    margin-top:10px;
    padding:10px;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<!-- LOGIN -->
<div id="loginPage">
    <div id="loginBox">
        <h2>🔐 HACK LOGIN</h2>
        <input type="text" id="user" placeholder="Username">
        <input type="password" id="pass" placeholder="Password">
        <button onclick="login()">ENTER</button>
        <p id="msg"></p>
    </div>
</div>

<!-- MAIN -->
<div id="main">
    <h1>DEVDAT KUMAR</h1>

    <button onclick="logout()">Logout ❌</button>

    <div id="notepad">
        <h2>🗓️ My Notes</h2>
        <textarea id="noteInput"></textarea><br>
        <button onclick="addNote()">Save Note</button>
        <button onclick="clearAll()">Delete All</button>

        <div id="notesList"></div>
    </div>
</div>

<script>

/* MATRIX EFFECT */
let c = document.getElementById("matrix");
let ctx = c.getContext("2d");

c.height = window.innerHeight;
c.width = window.innerWidth;

let letters = "@#₹#+₹#:;?".split("");
let fontSize = 16;
let columns = c.width / fontSize;
let drops = [];

for(let i=0;i<columns;i++){
    drops[i] = 1;
}

function draw(){
    ctx.fillStyle = "rgba(0, 100, 0, 0.1)";
    ctx.fillRect(0, 0, c.width, c.height);

    ctx.fillStyle = "#000";
    ctx.font = fontSize + "px monospace";

    for(let i=0;i<drops.length;i++){
        let text = letters[Math.floor(Math.random()*letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if(drops[i] * fontSize > c.height && Math.random() > 0.975){
            drops[i] = 0;
        }
        drops[i]++;
    }
}

setInterval(draw, 35);

/* USER SYSTEM */
let currentUser = "";

/* LOGIN */
function login(){
    let u = document.getElementById("user").value;
    let p = document.getElementById("pass").value;

    if(u === "dev123" && p === "dev123"){
        currentUser = u;
        localStorage.setItem("currentUser", currentUser);

        document.getElementById("loginPage").style.display = "none";
        document.getElementById("main").style.display = "block";

        loadNotes();
    } else {
        document.getElementById("msg").innerText = "❌ Wrong Login";
    }
}

/* LOGOUT */
function logout(){
    currentUser = "";
    localStorage.removeItem("currentUser");

    document.getElementById("main").style.display = "none";
    document.getElementById("loginPage").style.display = "flex";
}

/* ADD NOTE */
function addNote(){
    let text = noteInput.value;

    if(currentUser === ""){
        alert("Login first!");
        return;
    }

    let notes = JSON.parse(localStorage.getItem(currentUser + "_notes") || "[]");

    notes.push(text);
    localStorage.setItem(currentUser + "_notes", JSON.stringify(notes));

    noteInput.value="";
    loadNotes();
}

/* LOAD NOTES */
function loadNotes(){
    if(currentUser === "") return;

    let notes = JSON.parse(localStorage.getItem(currentUser + "_notes") || "[]");
    notesList.innerHTML="";

    notes.forEach((n,i)=>{
        let div = document.createElement("div");
        div.className="note";
        div.innerHTML = n + `<br><button onclick="deleteNote(${i})">Delete</button>`;
        notesList.appendChild(div);
    });
}

/* DELETE NOTE */
function deleteNote(i){
    let notes = JSON.parse(localStorage.getItem(currentUser + "_notes") || "[]");
    notes.splice(i,1);
    localStorage.setItem(currentUser + "_notes", JSON.stringify(notes));
    loadNotes();
}

/* CLEAR ALL */
function clearAll(){
    localStorage.removeItem(currentUser + "_notes");
    loadNotes();
}

/* AUTO LOGIN */
window.onload = function(){
    let savedUser = localStorage.getItem("currentUser");

    if(savedUser){
        currentUser = savedUser;

        document.getElementById("loginPage").style.display = "none";
        document.getElementById("main").style.display = "block";

        loadNotes();
    }
}

</script>

</body>
</html>
